name: Maintenance

# Manual jobs: commit a package-lock.json if the repo has none, and publish UI
# screenshots of the main screens to the `ci-screenshots` branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile-and-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: event_control
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/event_control
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/event_control
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      BOOTSTRAP_ADMIN_CODE: HR001
      BOOTSTRAP_ADMIN_PASSWORD: ci-admin-password
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Commit lockfile if missing
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already committed"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Add package-lock.json"
            git push
          fi

      - name: Build and start
        run: |
          npx prisma db push --skip-generate
          npm run build
          npm run start > server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3000/api/health >/dev/null && exit 0; sleep 1; done
          cat server.log; exit 1

      - name: Capture screenshots
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          node scripts/screenshots.mjs

      - name: Publish screenshots branch
        run: |
          cd screenshots
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b ci-screenshots
          git add -A
          git commit -q -m "UI screenshots for ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots

      - name: Annotate failure
        if: failure()
        run: |
          [ -f server.log ] && echo "::error title=Server log::$(tail -n 40 server.log | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')" || true
